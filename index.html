<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at 15% 20%, #38206b 0, transparent 28%),
    radial-gradient(circle at 85% 80%, #073b5c 0, transparent 30%),
    #070b14;
  overflow:hidden;
}

/* APP */
.app{
  width:100%;
  max-width:900px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* HEADER */
header{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(10,14,27,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:5;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:0 0 25px rgba(124,58,237,.5);
}

.brand-text h1{
  font-size:21px;
  letter-spacing:.3px;
}

.brand-text p{
  font-size:12px;
  color:#8e9bb5;
  margin-top:3px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#9ca9c4;
}

.dot{
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 10px #22c55e;
}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:28px 18px 150px;
  scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
  width:5px;
}

#chat::-webkit-scrollbar-thumb{
  background:#27304a;
  border-radius:10px;
}

/* WELCOME */
.welcome{
  text-align:center;
  padding:35px 10px 25px;
}

.welcome-icon{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:
    0 0 35px rgba(124,58,237,.45),
    inset 0 0 20px rgba(255,255,255,.12);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.welcome h2{
  font-size:30px;
  margin-bottom:10px;
}

.welcome h2 span{
  background:linear-gradient(90deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:#8792aa;
  font-size:14px;
  line-height:1.6;
}

/* QUICK BUTTONS */
.quick{
  display:flex;
  gap:9px;
  justify-content:center;
  flex-wrap:wrap;
  margin:5px auto 25px;
  max-width:650px;
}

.quick button{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:#cbd5e1;
  padding:10px 14px;
  border-radius:14px;
  cursor:pointer;
  font-size:13px;
  transition:.25s;
}

.quick button:hover{
  transform:translateY(-2px);
  border-color:#7c3aed;
  background:rgba(124,58,237,.16);
}

/* MESSAGES */
.msg{
  max-width:78%;
  padding:14px 17px;
  margin:12px 0;
  border-radius:20px;
  line-height:1.55;
  font-size:15px;
  word-wrap:break-word;
  animation:messageIn .3s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.msg.ai{
  margin-right:auto;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
  border-top-left-radius:6px;
  color:#e8edf7;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.msg.user{
  margin-left:auto;
  background:linear-gradient(135deg,#6d28d9,#2563eb);
  border-top-right-radius:6px;
  color:white;
  box-shadow:0 8px 25px rgba(37,99,235,.2);
}

/* TYPING */
.typing{
  display:flex;
  gap:5px;
  align-items:center;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8b5cf6;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* INPUT AREA */
.bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:15px 16px 18px;
  background:linear-gradient(
    transparent,
    rgba(7,11,20,.92) 25%
  );
}

.input-area{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px;
  border-radius:20px;
  background:rgba(20,26,43,.92);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 10px 40px rgba(0,0,0,.35),
    0 0 25px rgba(124,58,237,.08);
  backdrop-filter:blur(20px);
}

#input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:13px 12px;
  font-size:15px;
}

#input::placeholder{
  color:#68738b;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:15px;
  cursor:pointer;
  color:white;
  font-size:19px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  box-shadow:0 5px 18px rgba(99,102,241,.35);
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(99,102,241,.5);
}

.send:active{
  transform:scale(.94);
}

.clear{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  color:#9aa5ba;
  cursor:pointer;
  font-size:16px;
}

.clear:hover{
  background:rgba(255,255,255,.1);
  color:white;
}

.footer{
  text-align:center;
  color:#58647b;
  font-size:10px;
  margin-top:8px;
}

/* MOBILE */
@media(max-width:600px){
  header{
    height:68px;
    padding:0 14px;
  }

  .logo{
    width:40px;
    height:40px;
    font-size:21px;
  }

  .brand-text h1{
    font-size:18px;
  }

  .brand-text p{
    font-size:10px;
  }

  .welcome{
    padding-top:25px;
  }

  .welcome-icon{
    width:65px;
    height:65px;
    font-size:32px;
  }

  .welcome h2{
    font-size:25px;
  }

  .msg{
    max-width:88%;
    font-size:14px;
  }

  #chat{
    padding-left:12px;
    padding-right:12px;
  }

  .bottom{
    padding:10px 10px 13px;
  }

  .input-area{
    border-radius:18px;
  }

  #input{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">🤖</div>

    <div class="brand-text">
      <h1>Apna AI</h1>
      <p>Your personal AI assistant</p>
    </div>
  </div>

  <div class="online">
    <span class="dot"></span>
    Online
  </div>
</header>


<div id="chat">

  <div class="welcome" id="welcome">
    <div class="welcome-icon">✨</div>

    <h2>Namaste! <span>Apna AI</span></h2>

    <p>
      Main aapka personal AI assistant hoon.<br>
      Mujhse kuch bhi pooch sakte ho.
    </p>
  </div>

  <div class="quick" id="quick">
    <button onclick="quickMessage('Hello Apna AI 👋')">👋 Hello</button>
    <button onclick="quickMessage('Tumhara naam kya hai?')">🤖 Tumhara naam?</button>
    <button onclick="quickMessage('Mujhe ek shayari sunao')">❤️ Shayari</button>
    <button onclick="quickMessage('Mujhe motivate karo')">🔥 Motivation</button>
  </div>

  <div class="msg ai">
    Namaste! 👋 Main <b>Apna AI</b> hoon.<br>
    Aap Hindi ya English mein mujhse baat kar sakte ho. 😊
  </div>

</div>


<div class="bottom">

  <div class="input-area">

    <button class="clear" onclick="clearChat()" title="Clear chat">
      🗑️
    </button>

    <input
      id="input"
      type="text"
      placeholder="Apna message likho..."
      autocomplete="off"
    >

    <button class="send" onclick="send()" title="Send">
      ➤
    </button>

  </div>

  <div class="footer">
    Apna AI • Demo Mode
  </div>

</div>

</div>


<script>

function quickMessage(text){
  document.getElementById("input").value = text;
  send();
}


function send(){

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if(!text) return;

  // User message
  chat.innerHTML += `
    <div class="msg user">
      ${escapeHTML(text)}
    </div>
  `;

  input.value = "";

  chat.scrollTop = chat.scrollHeight;

  // Typing animation
  const typing = document.createElement("div");
  typing.className = "msg ai";
  typing.id = "typing";

  typing.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;


  setTimeout(() => {

    const oldTyping = document.getElementById("typing");

    if(oldTyping){
      oldTyping.remove();
    }

    let reply = getReply(text.toLowerCase());

    chat.innerHTML += `
      <div class="msg ai">
        ${reply}
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;

  },700);
}


function getReply(msg){

  if(
    msg.includes("hello") ||
    msg.includes("hi") ||
    msg.includes("namaste") ||
    msg.includes("नमस्ते")
  ){
    return "Namaste! 😊 Aap kaise ho? Main Apna AI hoon. Aaj kya baat karni hai?";
  }


  if(
    msg.includes("naam") ||
    msg.includes("name")
  ){
    return "Mera naam <b>Apna AI</b> hai 🤖✨. Ye aapka apna personal AI assistant hai.";
  }


  if(
    msg.includes("kaise ho") ||
    msg.includes("how are you")
  ){
    return "Main bilkul badhiya hoon 😎🔥 Aap batao, aap kaise ho?";
  }


  if(
    msg.includes("shayari") ||
    msg.includes("शायरी")
  ){
    return "❤️ <b>Shayari:</b><br><br>\"Dil se jo baat nikle, woh khaas hoti hai,<br>Har kisi ke naseeb mein kahan aisi mulaqat hoti hai...\" ✨";
  }


  if(
    msg.includes("love") ||
    msg.includes("pyaar") ||
    msg.includes("pyar")
  ){
    return "❤️ Pyaar woh ehsaas hai jo lafzon se nahi, aankhon se samajh aata hai.";
  }


  if(
    msg.includes("motivate") ||
    msg.includes("motivation")
  ){
    return "🔥 Haar mat maanna! Aaj ka chhota step hi kal ki badi success ban sakta hai. Bas lage raho 💪";
  }


  if(
    msg.includes("thank") ||
    msg.includes("thanks")
  ){
    return "You're welcome! 😊 Jab bhi zarurat ho, Apna AI yahin hai.";
  }


  if(
    msg.includes("help") ||
    msg.includes("madad")
  ){
    return "Bilkul! 🤝 Apna message likho aur main jitni help kar sakta hoon, karunga.";
  }


  return `
    Demo mode mein hoon 🤖<br><br>
    Aapne poocha: <b>${escapeHTML(msg)}</b><br><br>
    Abhi mere paas real AI API connected nahi hai.
    API connect hone ke baad main real AI answers de sakunga. 🚀
  `;
}


function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function clearChat(){

  const chat = document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">✨</div>

      <h2>Welcome to <span>Apna AI</span></h2>

      <p>
        Main aapka personal AI assistant hoon.<br>
        Mujhse kuch bhi pooch sakte ho.
      </p>
    </div>

    <div class="quick">
      <button onclick="quickMessage('Hello Apna AI 👋')">👋 Hello</button>
      <button onclick="quickMessage('Tumhara naam kya hai?')">🤖 Tumhara naam?</button>
      <button onclick="quickMessage('Mujhe ek shayari sunao')">❤️ Shayari</button>
      <button onclick="quickMessage('Mujhe motivate karo')">🔥 Motivation</button>
    </div>

    <div class="msg ai">
      Chat clear ho gayi. 😊<br>
      Batao, ab kya baat karni hai?
    </div>
  `;

}


document
  .getElementById("input")
  .addEventListener("keydown", function(e){

    if(e.key === "Enter"){
      send();
    }

  });

</script>

</body>
  </html>
